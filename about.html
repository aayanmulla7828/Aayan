<!DOCTYPE html>
<html>
<head>
<title>About Me</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
    display:flex;
}

/* Left Sidebar Navigation */

.nav{
    width:260px;
    height:100vh;
    background:rgba(0,0,0,0.75);
    backdrop-filter:blur(10px);
    position:fixed;
    left:0;
    top:0;
    padding-top:40px;
    box-shadow:5px 0px 20px rgba(0,0,0,0.5);
}

/* Profile Section */

.profile-box{
    text-align:center;
    margin-bottom:40px;
}

.profile{
    width:170px;
    height:170px;
    border-radius:50%;
    border:5px solid cyan;
    object-fit:cover;
    object-position:center top;
    box-shadow:0px 0px 25px cyan;
    transition:0.5s;
}

.profile:hover{
    transform:scale(1.08);
    box-shadow:0px 0px 40px cyan;
}

.profile-box h1{
    margin-top:15px;
    font-size:30px;
}

.profile-box p{
    color:#ccc;
    margin-top:8px;
    font-size:18px;
}

/* Navigation Links */

.nav a{
    display:block;
    color:white;
    text-decoration:none;
    padding:18px;
    margin:10px 20px;
    border-radius:12px;
    font-size:20px;
    transition:0.3s;
    text-align:center;
}

.nav a:hover{
    background:cyan;
    color:black;
    transform:translateX(5px);
}

/* Main Content */

.main{
    margin-left:260px;
    width:100%;
    padding:40px;
}

/* About Card */

.card{
    width:85%;
    margin:auto;
    margin-top:40px;
    background:rgba(255,255,255,0.08);
    padding:50px;
    border-radius:25px;
    text-align:center;
    box-shadow:0px 0px 20px rgba(0,0,0,0.4);
    backdrop-filter:blur(10px);
    animation:fadeIn 1.5s ease;
}

/* Heading */

.card h2{
    font-size:45px;
    color:cyan;
    margin-bottom:30px;
}

/* Paragraph */

.card p{
    font-size:22px;
    line-height:38px;
    color:#f1f1f1;
}

/* Skills */

.skills{
    margin-top:40px;
}

.skills span{
    display:inline-block;
    background:cyan;
    color:black;
    padding:12px 22px;
    margin:10px;
    border-radius:30px;
    font-size:18px;
    font-weight:bold;
    transition:0.3s;
}

.skills span:hover{
    transform:scale(1.1);
    background:white;
    box-shadow:0px 0px 15px white;
}

/* Animation */

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Responsive */

@media(max-width:900px){

    body{
        flex-direction:column;
    }

    .nav{
        width:100%;
        height:auto;
        position:relative;
        padding-bottom:20px;
    }

    .main{
        margin-left:0;
        padding:20px;
    }

    .card{
        width:100%;
        padding:30px;
    }

    .card h2{
        font-size:35px;
    }

    .card p{
        font-size:18px;
        line-height:30px;
    }

}

</style>
</head>

<body>

<!-- Sidebar -->

<div class="nav">

    <div class="profile-box">

        <img src="myphoto.jpg" class="profile">

        <h1>Aayan Mulla</h1>

        <p>Web Developer</p>

    </div>

    <a href="index.html">🏠 Home</a>
    <a href="about.html">👨 About</a>
    <a href="project.html">💻 Projects</a>
    <a href="contact.html">📞 Contact</a>

</div>

<!-- Main Content -->

<div class="main">

    <div class="card">

        <h2>About Me</h2>

        <p>
            Hello! I am <b>Aayan Mulla</b>, a Computer Engineering student
            and passionate Web Developer.
            I enjoy creating modern websites and applications.
            I also work with Java, PHP and Android Development.
        </p>

        <div class="skills">

            <span>HTML</span>
            <span>CSS</span>
            <span>Java</span>
            <span>PHP</span>
            <span>Android</span>

        </div>

    </div>

</div>

</body>
</html>
