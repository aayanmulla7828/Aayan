<!-- Stylish index.html -->

<!DOCTYPE html>
<html>
<head>
<title>Portfolio Home</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial;
    background:linear-gradient(to right,#141e30,#243b55);
    color:white;
}

/* Header */

.header{
    text-align:center;
    padding:40px;
}

.profile{
    width:170px;
    height:170px;
    border-radius:50%;
    border:5px solid cyan;
    box-shadow:0px 0px 20px cyan;
    transition:0.5s;
}

.profile:hover{
    transform:scale(1.05);
}

.header h1{
    margin-top:15px;
    font-size:40px;
}

.header p{
    font-size:20px;
    color:#ddd;
}

/* Navigation */

.nav{
    background:rgba(0,0,0,0.5);
    padding:15px;
    text-align:center;
    backdrop-filter:blur(5px);
}

.nav a{
    color:white;
    text-decoration:none;
    margin:20px;
    font-size:20px;
    transition:0.3s;
}

.nav a:hover{
    color:cyan;
    border-bottom:2px solid cyan;
    padding-bottom:5px;
}

/* Main Content */

.container{
    width:80%;
    margin:auto;
    margin-top:40px;
}

.card{
    background:rgba(255,255,255,0.1);
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0px 0px 15px black;
    backdrop-filter:blur(10px);
}

.card h2{
    font-size:35px;
    margin-bottom:20px;
    color:cyan;
}

.card p{
    font-size:20px;
    line-height:30px;
}

/* Button */

.btn{
    display:inline-block;
    margin-top:25px;
    padding:12px 25px;
    background:cyan;
    color:black;
    text-decoration:none;
    font-size:18px;
    border-radius:30px;
    transition:0.3s;
}

.btn:hover{
    background:white;
    transform:scale(1.1);
}

</style>
</head>

<body>

<div class="header">

    <!-- Your Photo -->
    <img src="myphoto.jpeg" class="profile">

    <h1>Aayan Mulla</h1>
    <p>Web Developer | Programmer | Student</p>

</div>

<div class="nav">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="project.html">Projects</a>
    <a href="contact.html">Contact</a>
</div>

<div class="container">

    <div class="card">

        <h2>Welcome To My Portfolio</h2>

        <p>
            Hello! I am Aayan Mulla.  
            I am passionate about Web Development,
            Java Programming, Android Development
            and creating modern websites.
        </p>

        <a href="project.html" class="btn">
            View Projects
        </a>

    </div>

</div>

</body>
</html>
