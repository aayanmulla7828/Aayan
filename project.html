<!-- Stylish project.html -->

<!DOCTYPE html>
<html>
<head>
<title>My Projects</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial;
    background:linear-gradient(to right,#141e30,#243b55);
    color:white;
}

/* Navigation */

.nav{
    background:rgba(0,0,0,0.5);
    padding:15px;
    text-align:center;
    backdrop-filter:blur(5px);
}

.nav a{
    color:white;
    text-decoration:none;
    margin:20px;
    font-size:20px;
    transition:0.3s;
}

.nav a:hover{
    color:cyan;
    border-bottom:2px solid cyan;
    padding-bottom:5px;
}

/* Main Container */

.container{
    width:85%;
    margin:auto;
    margin-top:50px;
}

/* Heading */

.heading{
    text-align:center;
    font-size:40px;
    color:cyan;
    margin-bottom:40px;
}

/* Project Cards */

.project-box{
    display:flex;
    justify-content:center;
    gap:25px;
    flex-wrap:wrap;
}

.card{
    width:280px;
    background:rgba(255,255,255,0.1);
    padding:25px;
    border-radius:20px;
    text-align:center;
    box-shadow:0px 0px 15px black;
    backdrop-filter:blur(10px);
    transition:0.4s;
}

.card:hover{
    transform:translateY(-10px);
    box-shadow:0px 0px 20px cyan;
}

.card h2{
    color:cyan;
    margin-bottom:15px;
}

.card p{
    font-size:17px;
    line-height:28px;
    color:#f1f1f1;
}

/* Button */

.btn{
    display:inline-block;
    margin-top:20px;
    padding:10px 20px;
    background:cyan;
    color:black;
    text-decoration:none;
    border-radius:25px;
    font-weight:bold;
    transition:0.3s;
}

.btn:hover{
    background:white;
    transform:scale(1.1);
}

</style>
</head>

<body>

<div class="nav">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="project.html">Projects</a>
    <a href="contact.html">Contact</a>
</div>

<div class="container">

    <h1 class="heading">My Projects</h1>

    <div class="project-box">

        <!-- Project 1 -->

        <div class="card">
            <h2>Notes App</h2>

            <p>
                Android Notes application created using Java
                in Android Studio.
            </p>

            <a href="#" class="btn">View</a>
        </div>

        <!-- Project 2 -->

        <div class="card">
            <h2>To-Do List</h2>

            <p>
                Task management web application developed
                using PHP and MySQL.
            </p>

            <a href="#" class="btn">View</a>
        </div>

        <!-- Project 3 -->

        <div class="card">
            <h2>Portfolio Website</h2>

            <p>
                Personal portfolio website created using
                HTML and CSS.
            </p>

            <a href="#" class="btn">View</a>
        </div>

    </div>

</div>

</body>
</html>
